[project]
name = "eeg-networks"
dynamic = ["version"]
description = "基于PyTorch的各种用于EEG分类任务的简单网络的实现。"
authors = [
    {name = "六个骨头", email = "2742392377@qq.com"},
]
dependencies = ["torch", "tqdm", "h5py", "numpy", "typer"]
requires-python = ">=3.8"
license = {text = "MIT"}
readme = "README.md"

[project.urls]
Homepage = "https://github.com/zrr1999/eeg-networks-pytorch"
Repository = "https://github.com/zrr1999/eeg-networks-pytorch.git"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "eeg_networks/__version__.py"
template = "__version__ = '{version}'"

[tool.hatch.build.targets.wheel]
packages = ["eeg_networks"]

[tool.ruff]
line-length = 100
src = ["eeg_networks"]
target-version = "py39"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # Isort
    "I",
    # Pyupgrade
    "UP",
    # Flake8
    "B",
    "C4",
    "YTT",
    "TID",
    # "PTH",
    # Pygrep-hooks
    "PGH",
    # Ruff-specific rules
    "RUF",
]
ignore = ["F841", "PGH003", "UP038", "B008", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["eeg_networks"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I002"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
