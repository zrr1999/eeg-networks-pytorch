name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run ruff format check
        run: uvx ruff format --check .
      - name: Run ruff lint
        run: uvx ruff check .
